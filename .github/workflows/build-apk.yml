name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Clean and Build
        run: |
          rm -rf android
          flutter create . --platforms=android
          sed -i 's/android:label="quran_touch_reader"/android:label="Quran Shareef Reader"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: Quran-Shareef-Reader-APK
          path: build/app/outputs/flutter-apk/app-release.apk
