name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Fixed Files
        run: |
          cat > pubspec.yaml << 'YAML'
          name: quran_touch_reader
          description: Quran Shareef Reader
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
          YAML
          
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:Scaffold(appBar:AppBar(title:Text('Quran Shareef Reader'),backgroundColor:Colors.green[800]),body:Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.mosque,size:80,color:Colors.green),SizedBox(height:20),Text('القرآن الكريم',style:TextStyle(fontSize:32)),Text('Quran Shareef Reader - Build Success!',style:TextStyle(color:Colors.green))])))));
          DART

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Android Folder
        run: |
          ls -la
          if [ ! -d "android" ]; then
            echo "Android folder missing - Creating..."
            flutter create . --platforms=android --org com.quran.reader
          fi
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Quran-APK
          path: build/app/outputs/flutter-apk/app-release.apk
