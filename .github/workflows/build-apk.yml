name: Build Quran APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Setup project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --project-name quran_touch_reader --overwrite
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          echo "Fixing SDK 35..."
          # For new Flutter project structure
          sed -i 's/compileSdk.*/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdk.*/targetSdk = 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 35/' android/app/build.gradle || true
          # Also patch local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          cat android/app/build.gradle | head -40
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: quran-touch-apk
          path: build/app/outputs/flutter-apk/app-release.apk
