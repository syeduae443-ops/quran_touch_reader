name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Folder
        run: |
          rm -rf android
          flutter create . --platforms=android
          # Change app name to Quran Shareef Reader
          sed -i 's/android:label="quran_touch_reader"/android:label="Quran Shareef Reader"/g' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Quran-Shareef-Reader-APK
          path: build/app/outputs/flutter-apk/app-release.apk
