name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Create Kaba Icon
        run: |
          mkdir -p assets
          echo "Creating icon..."
          python3 -c "
          from PIL import Image, ImageDraw
          try:
              img = Image.new('RGB', (1024,1024), (2,120,70))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([40,40,984,984], radius=120, outline=(255,220,120), width=8)
              d.rectangle([220,280,804,820], fill=(15,15,15))
              d.rectangle([220,460,804,520], fill=(255,215,80))
              d.rectangle([380,600,580,810], fill=(255,215,80))
              img.save('assets/icon.png')
              print('Icon created')
          except Exception as e:
              print(f'Icon error: {e}')
              # Create blank if fails
              Image.new('RGB', (1024,1024), (2,120,70)).save('assets/icon.png')
          "

      - name: Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Shareef-Kaba-APK
          path: build/app/outputs/flutter-apk/app-release.apk
